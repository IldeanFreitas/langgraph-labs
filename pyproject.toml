[project]
name = "langgraph-labs"
version = "0.1.0"
description = "Laboratorio LangGraph do basico ao avancado, usando a BrasilAPI como fonte de dados"
requires-python = ">=3.12,<3.14"
dependencies = [
    # nucleo - versoes verificadas em 19/set/2026
    "langgraph>=1.2.11,<1.3",
    "langchain>=1.4.2,<1.5",
    "langchain-google-genai>=4.4.0,<5",
    # persistencia (lab 3 em diante)
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    "psycopg[binary,pool]>=3.2",
    # ferramentas
    "httpx>=0.27",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labs"]
