# Sobe apenas o Postgres usado como checkpointer/store a partir do lab 3.
# Uso: docker compose up -d     |     docker compose down
services:
  postgres:
    image: postgres:16-alpine
    container_name: langgraph-labs-pg
    environment:
      POSTGRES_USER: langgraph
      POSTGRES_PASSWORD: langgraph
      POSTGRES_DB: langgraph
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
